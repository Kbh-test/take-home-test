<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 44 760 608" width="760" height="608" role="img" aria-label="Ingest only stores; workers do the slow, failing steps with retries" font-size="13" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"><rect width="760" height="652" fill="#ffffff"></rect><defs><marker id="arch-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b4b1a7"></path></marker></defs><g><rect x="24" y="68" width="712" height="112" rx="8" fill="none" stroke="#dcdad2" stroke-width="1.25"></rect><text x="40" y="90" font-size="11.5" font-weight="600" fill="#5c5b57">1 · Ingest, inside the HTTP request</text></g><g><rect x="252" y="236" width="484" height="176" rx="8" fill="none" stroke="#dcdad2" stroke-width="1.25"></rect><text x="720" y="258" text-anchor="end" font-size="11.5" font-weight="600" fill="#5c5b57">2 · Worker: process_form job</text></g><g><rect x="252" y="452" width="484" height="176" rx="8" fill="none" stroke="#dcdad2" stroke-width="1.25"></rect><text x="268" y="474" font-size="11.5" font-weight="600" fill="#5c5b57">3 · Worker: outbox jobs</text></g><g><rect x="24" y="236" width="212" height="392" rx="8" fill="none" stroke="#dcdad2" stroke-width="1.25"></rect><text x="40" y="258" font-size="11.5" font-weight="600" fill="#5c5b57">Review tickets</text><text x="130" y="568" text-anchor="middle" font-size="11.5" fill="#5c5b57">one ticket per form or job</text><text x="130" y="584" text-anchor="middle" font-size="11.5" fill="#5c5b57">CLI: list · requeue · close</text><text x="130" y="600" text-anchor="middle" font-size="11.5" fill="#5c5b57">/workers page: requeue</text></g><g fill="none" stroke="#b4b1a7" stroke-width="1.25"><path d="M240 136H280" marker-end="url(#arch-arrow)"></path><path d="M480 136H520" marker-end="url(#arch-arrow)"></path><path d="M620 164V200H380V268" marker-end="url(#arch-arrow)"></path><path d="M30