"40" y="268" width="180" height="56" rx="8" fill="none" fill-opacity="1" stroke="#b4b1a7" stroke-width="1.25"></rect><text x="130" y="292" text-anchor="middle" font-weight="600" fill="#1f1f1d">Form blocked</text><text x="130" y="308" text-anchor="middle" font-size="11.5" fill="#5c5b57">invalid or conflict</text></g><g><rect x="40" y="452" width="180" height="56" rx="8" fill="none" fill-opacity="1" stroke="#b4b1a7" stroke-width="1.25"></rect><text x="130" y="476" text-anchor="middle" font-weight="600" fill="#1f1f1d">Dead job</text><text x="130" y="492" text-anchor="middle" font-size="11.5" fill="#5c5b57">retry limit or uncertain delivery</text></g></svg>
